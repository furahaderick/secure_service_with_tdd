[project]
name = "secure-service-with-tdd"
version = "0.1.0"
description = ""
authors = [
    {name = "furahayves",email = "yvesderricks@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt (>=5.0.0,<6.0.0)"
]

[tool.poetry]
packages = [{include = "secure_service_with_tdd", from = "src"}]

[tool.coverage]
branch = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.16.0,<4.0.0)",
    "coverage (>=7.16.2,<8.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]
